[package]
name = "my-porto"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.6.20"
tokio = { version = "1.28", features = ["full"] }
tower = "0.4.13"
tower-http = { version = "0.4.4", features = ["fs", "cors", "compression-gzip"] }
serde = { version = "1.0.180", features = ["derive"] }
serde_json = "1.0.104"
sqlx = { version = "0.6.3", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4.26", features = ["serde"] }
askama = "0.12.0"
askama_axum = "0.3.0"
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
anyhow = "1.0.75"
dashmap = "5.5.0"
once_cell = "1.18"
