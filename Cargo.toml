[package]
name = "my-porto"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.6.0"
tokio = { version = "1.25", features = ["full"] }
tower = "0.4.0"
tower-http = { version = "0.4.0", features = ["fs", "cors", "compression-gzip"] }
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.90"
sqlx = { version = "0.6.0", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.2", features = ["v4", "serde"] }
chrono = { version = "0.4.23", features = ["serde"], default-features = false }
tracing = "0.1.35"
tracing-subscriber = "0.3.15"
anyhow = "1.0.65"
dashmap = "5.4"
once_cell = "1.15"
