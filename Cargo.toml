[package]
name = "my-porto"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.5", features = ["multipart"] }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5.0", features = ["fs", "cors", "compression-gzip"] }
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1.0.108"
sqlx = { version = "0.7.3", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4.31", features = ["serde"], default-features = false }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
anyhow = "1.0.75"
dashmap = "5.5"
once_cell = "1.15"
