[package]
name = "my-porto"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.6.20", features = ["multipart", "headers"] }
tokio = { version = "1.28", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["fs", "cors", "compression-gzip"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
sqlx = { version = "0.6.3", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
chrono = { version = "0.4.24", features = ["serde"], default-features = false }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
anyhow = "1.0.70"
dashmap = "5.4"
once_cell = "1.15"
