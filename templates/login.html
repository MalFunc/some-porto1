<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔐 Admin Login - CTF Portfolio</title>
    <style>
        body {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 30px #00ff00;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ff0080;
            text-shadow: 2px 2px 4px #000;
            font-size: 2em;
            margin-bottom: 30px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 4px #000, 0 0 10px #ff0080; }
            to { text-shadow: 2px 2px 4px #000, 0 0 20px #ff0080, 0 0 30px #ff0080; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #00ffff;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #ff0080;
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff0080, #00ff00);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #ffff00;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid #ffff00;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link a:hover {
            background: #ffff00;
            color: #000;
        }

        .hint {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-top: 20px;
            padding: 10px;
            border: 1px dashed #444;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 ADMIN ACCESS</h1>
        
        {% if error %}
        <div class="error">
            ❌ {{ error }}
        </div>
        {% endif %}
        
        <form method="post" action="/login">
            <div class="form-group">
                <label for="username">👤 Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">🔑 Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="login-btn">🚀 HACK IN</button>
        </form>
        
        <div class="back-link">
            <a href="/">🏠 Back to Home</a>
        </div>
        
        <div class="hint">
            💡 Default: admin / admin123
        </div>
    </div>
</body>
</html>
